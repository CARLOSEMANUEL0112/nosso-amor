<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />

    <!-- Viewport -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- SEO -->
    <title>Carlos & Thauana — 6 Anos de Nós ❤️</title>

    <meta
      name="description"
      content="Uma história construída com amor, cumplicidade e momentos que se tornaram inesquecíveis. Celebrando 6 anos de nós."
    />

    <meta
      name="author"
      content="Carlos & Thauana"
    />

    <meta
      name="robots"
      content="index, follow"
    />

    <!-- Impede tradução automática -->
    <meta
      name="google"
      content="notranslate"
    />

    <!-- Tema do navegador e dispositivos móveis -->
    <meta
      name="theme-color"
      content="#030305"
    />

    <meta
      name="color-scheme"
      content="dark"
    />

    <!-- Favicon -->
    <link
      rel="icon"
      type="image/png"
      href="/favicon-c-t.png"
    />

    <link
      rel="apple-touch-icon"
      href="/favicon-c-t.png"
    />

    <!-- Open Graph -->
    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:title"
      content="Carlos & Thauana — 6 Anos de Nós ❤️"
    />

    <meta
      property="og:description"
      content="O tempo passou a voar, mas cada segundo ao teu lado valeu por uma vida inteira. Uma celebração da nossa história, das nossas memórias e do nosso amor."
    />

    <meta
      property="og:image"
      content="/og-image.png"
    />

    <meta
      property="og:image:alt"
      content="Carlos & Thauana — 6 Anos de Nós"
    />

    <meta
      property="og:locale"
      content="pt_BR"
    />

    <!-- Twitter / X -->
    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="Carlos & Thauana — 6 Anos de Nós ❤️"
    />

    <meta
      name="twitter:description"
      content="Um tributo digital para celebrar 6 anos de cumplicidade, memórias e amor."
    />

    <meta
      name="twitter:image"
      content="/og-image.png"
    />

    <meta
      name="twitter:image:alt"
      content="Carlos & Thauana — 6 Anos de Nós"
    />
  </head>

  <body
    class="bg-[#030305] text-white antialiased selection:bg-rose-500/30 selection:text-rose-200"
  >
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </body>
</html>
